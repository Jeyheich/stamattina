name: Edizione giornaliera revisionata
on:
  workflow_dispatch:
# Non attivato: scommentare solo dopo aver collegato e provato il produttore.
#  schedule:
#    - cron: '33 7,8 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate delle 09:33 di Roma
        id: gate
        run: |
          hour=$(TZ=Europe/Rome date +%H)
          if [ "$hour" = "09" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Verifica edizione pronta
        if: steps.gate.outputs.run == 'true'
        run: |
          test -f incoming/edition.json
          node scripts/promote.mjs
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.gate.outputs.run == 'true'
