name: Pubblica Stamattina
on:
  workflow_dispatch:
    inputs:
      collectionId:
        description: 'Ciclo esplicito YYYY-MM-DD-mattina o YYYY-MM-DD-pomeriggio (vuoto: ciclo corrente Roma)'
        required: false
        type: string
      editorialCheckpoint:
        description: Avvio richiesto da un ramo editoriale
        type: boolean
        default: false
      recoverOlderEdition:
        description: Pubblica un ciclo arretrato completo con la sua data originale
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'incoming/edition.json'
      - 'automation/editorial/**'
      - 'automation/BATCH_BRIEF.md'
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    outputs:
      recoverCandidates: ${{ steps.incoming.outputs.recoverCandidates }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica regressioni dei cicli persistenti
        run: |
          node scripts/test_editorial_cycles.mjs
          python3 scripts/test_publication.py
      - name: Verifica ripresa e completezza delle aggiuntive
        run: node scripts/test_batches.mjs
      - name: Seleziona il ciclo dell evento senza dipendere dalla coda
        run: node scripts/select_editorial_cycle.mjs
      - name: Importa i checkpoint dei due rami editoriali
        run: node scripts/import_editorial_branches.mjs
      - name: Ricomponi i blocchi editoriali senza perdere progressi
        id: batches
        run: node scripts/assemble_batches.mjs automation/editorial --recover-history
      - name: Rileva una nuova edizione proposta
        id: incoming
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BATCH_READY: ${{ steps.batches.outputs.ready }}
          EDITORIAL_CHECKPOINT: ${{ inputs.editorialCheckpoint }}
        run: |
          if [ "$BATCH_READY" = 'true' ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          recover_candidates=false
          if [ "$EDITORIAL_CHECKPOINT" = 'true' ] && [ "$BATCH_READY" != 'true' ]; then
            echo 'recoverCandidates=true' >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = 'push' ] && [ "$BATCH_READY" != 'true' ] &&
            git diff --name-only "$BEFORE" "$GITHUB_SHA" -- automation/editorial |
              grep -E '^automation/editorial/[0-9]{4}-[0-9]{2}-[0-9]{2}/((mattina|pomeriggio)/)?(politica|esteri|economia|cronaca|roma|cultura|tecnologia|sport)\.json$' >/dev/null; then
            recover_candidates=true
            echo 'recoverCandidates=true' >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            if [ "$EDITORIAL_RECOVERY" != 'true' ] && [ "$EDITORIAL_CHECKPOINT" != 'true' ]; then
              echo 'ui=true' >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EDITORIAL_RELEASE_NOV6_BASE" != 'true' ] &&
            { ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- dist ||
              { [ "$recover_candidates" != 'true' ] && ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- scripts .github/workflows/pages.yml; }; }; then
            echo 'ui=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Controlla fonti, foto e date prima della pubblicazione
        id: sources
        if: steps.incoming.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate.mjs incoming/edition.json --production --balanced 2>&1 | tee /tmp/brief-source-check.log
          failures="$(mktemp -d)/sources.json"
          if ! python3 scripts/verify_sources.py incoming/edition.json "$failures" 2>&1 | tee -a /tmp/brief-source-check.log; then
            if [ ! -s "$failures" ]; then
              exit 1
            fi
            node scripts/recover_unreadable_sources.mjs "$failures" 2>&1 | tee -a /tmp/brief-source-check.log
          fi
      - name: Conserva la causa dei controlli falliti per la ripresa
        if: steps.sources.outcome == 'failure'
        run: node scripts/record_source_failure.mjs /tmp/brief-source-check.log
      - name: Promuovi una nuova edizione soltanto dopo i controlli
        if: steps.incoming.outputs.changed == 'true' && steps.sources.outcome == 'success'
        run: node scripts/promote.mjs
      - name: Verifica rassegna reale
        run: node scripts/validate.mjs dist/data/current.json --production
      - name: Conserva edizione e archivio validati
        run: |
          if [ -n "$(git status --porcelain -- dist/data incoming/edition.json automation/editorial)" ]; then
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- dist/data incoming/edition.json automation/editorial
            git commit -m 'Save editorial progress and verified edition'
            git push origin HEAD:main
          fi
      - name: Impedisci la pubblicazione dopo un controllo fallito
        if: steps.sources.outcome == 'failure'
        run: exit 1
      - name: Impedisci deploy di una revisione superata da modifiche concorrenti
        if: steps.incoming.outputs.changed == 'true' || steps.incoming.outputs.ui == 'true'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/configure-pages@v5
        if: steps.incoming.outputs.changed == 'true' || steps.incoming.outputs.ui == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.incoming.outputs.changed == 'true' || steps.incoming.outputs.ui == 'true'
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.incoming.outputs.changed == 'true' || steps.incoming.outputs.ui == 'true'
      - name: Verifica l'edizione realmente servita al telefono
        id: public
        if: (steps.batches.outputs.complete == 'true' || steps.deployment.outcome == 'success') && steps.sources.outcome != 'failure'
        run: python3 scripts/verify_publication.py
      - name: Conserva la prova della pubblicazione effettiva
        if: steps.public.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- automation/editorial
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified public edition'
            git push origin HEAD:main
          fi
  recover-candidates:
    name: Recupera il dossier dopo un checkpoint incompleto
    needs: deploy
    if: needs.deploy.outputs.recoverCandidates == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-candidates.yml
