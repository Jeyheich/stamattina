name: Pubblica Stamattina
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'incoming/edition.json'
      - 'automation/editorial/**'
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ricomponi i blocchi editoriali senza perdere progressi
        id: batches
        run: node scripts/assemble_batches.mjs
      - name: Rileva una nuova edizione proposta
        id: incoming
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BATCH_READY: ${{ steps.batches.outputs.ready }}
        run: |
          if [ "$BATCH_READY" = 'true' ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'push' ] && ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- incoming/edition.json; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'ui=true' >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- dist scripts .github/workflows/pages.yml; then
            echo 'ui=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Controlla fonti, foto e date prima della pubblicazione
        id: sources
        if: steps.incoming.outputs.changed == 'true'
        continue-on-error: true
        run: |
          node scripts/validate.mjs incoming/edition.json --production --balanced 2>&1 | tee /tmp/brief-source-check.log
          python3 scripts/verify_sources.py incoming/edition.json 2>&1 | tee -a /tmp/brief-source-check.log
      - name: Conserva la causa dei controlli falliti per la ripresa
        if: steps.sources.outcome == 'failure'
        run: node scripts/record_source_failure.mjs /tmp/brief-source-check.log
      - name: Promuovi una nuova edizione soltanto se valida e di oggi
        if: steps.incoming.outputs.changed == 'true' && steps.sources.outcome == 'success'
        run: node scripts/promote.mjs
      - name: Verifica rassegna reale
        run: node scripts/validate.mjs dist/data/current.json --production
      - name: Conserva edizione e archivio validati
        run: |
          if [ -n "$(git status --porcelain -- dist/data incoming/edition.json automation/editorial/status.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- dist/data incoming/edition.json automation/editorial/status.json
            git commit -m 'Save editorial progress and verified edition'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Impedisci la pubblicazione dopo un controllo fallito
        if: steps.sources.outcome == 'failure'
        run: exit 1
      - uses: actions/configure-pages@v5
        if: steps.incoming.outputs.changed == 'true' || steps.incoming.outputs.ui == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.incoming.outputs.changed == 'true' || steps.incoming.outputs.ui == 'true'
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.incoming.outputs.changed == 'true' || steps.incoming.outputs.ui == 'true'
