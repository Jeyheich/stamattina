name: Prova consegna cloud
on:
  push:
    branches: [prova-consegna-artifact]
    paths: [.github/workflows/prova-consegna-artifact.yml]
permissions: {}
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica la fonte e prepara evidenza sintetica
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          from html import unescape
          url = 'https://www.everyeye.it/notizie/capitano-spaziale-gameplay-atteso-the-expanse-osiris-reborn-911335.html'
          with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=15) as response:
              page = response.read().decode(errors='replace')
          date = re.search(r'"datePublished"\s*:\s*"([^"]+)"', page).group(1)
          body = re.search(r'id="inread"[^>]*>(.*?)class="riassunto_guide"', page, re.S).group(1)
          body = unescape(re.sub(r'<[^>]+>', ' ', body))
          checks = {'gameplay_presentato': r'gameplay', 'titolo_del_video': r'Becoming Captain', 'missione_di_salvataggio': r'salvat|soccors', 'premi': r'Golden Joystick'}
          evidence = {key: bool(re.search(pattern, body, re.I)) for key, pattern in checks.items()}
          assert evidence['gameplay_presentato'] and evidence['titolo_del_video'] and evidence['premi']
          with open('prova.json', 'w') as output:
              json.dump({'date':date,'url':url,'source':'Everyeye','game':'The Expanse: Osiris Reborn','evidence':evidence}, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prova-fonte-everyeye
          path: prova.json
          retention-days: 1
